<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Playground</title>
  <meta name="description" content="A collection of tactile toys, audio tools, visual experiments and arcade mini-games that runs in the browser.">
  <meta name="theme-color" content="#0f0e0c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Playground">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="The Playground, home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--accent)"/><circle cx="12" cy="13" r="4" fill="var(--accent-ink)"/><rect x="17" y="17" width="8" height="8" rx="2" fill="var(--accent-ink)"/><path d="M8 24l5-6 4 6z" fill="var(--accent-ink)"/></svg>
      <span>The Playground</span>
    </a>
    <nav class="top-actions" aria-label="Global">
      <a class="icon-btn" href="#/" id="homeBtn" aria-label="Home" title="Home"></a>
      <label class="search" id="searchWrap">
        <span class="sr">Search experiences</span>
        <input id="search" type="search" placeholder="Search…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <button class="icon-btn" id="soundBtn" aria-pressed="true" title="Sound"></button>
      <button class="icon-btn" id="hapticsBtn" aria-pressed="true" title="Haptics"></button>
      <button class="cap-pill" id="capBtn" title="Device capabilities"></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings"></button>
    </nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>
  <noscript><p style="padding:2rem;color:#eee">The Playground needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
